name: external-data
# Fetches the external source files that the build environment cannot reach (BEA input-output use table,
# BLS OEWS occupation-by-industry and national files) and commits them under data/external/ on the branch
# the workflow is run from. Run it from the Actions tab (workflow_dispatch); the ingest modules read from
# data/external/ when the files are present.
on:
  workflow_dispatch:
    inputs:
      bea_urls:
        description: space-separated BEA spreadsheet URLs to fetch (optional; defaults to the SUT-framework summary use table candidates)
        required: false
        default: ''
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Discover BEA input-output files
        run: |
          set -e
          mkdir -p data/external/bea
          UA="Mozilla/5.0 (X11; Linux x86_64) aiwsim-data-fetch"
          echo "== probe one candidate and show what came back"
          curl -sS -L -A "$UA" -o /tmp/probe.bin -w "code %{http_code} type %{content_type} size %{size_download}\n" "https://apps.bea.gov/industry/xls/io-annual/Use_SUT_Framework_2017-2023_SUM.xlsx" || true
          head -c 1500 /tmp/probe.bin; echo
          echo "== links on the input-output accounts data page"
          curl -sS -L -A "$UA" "https://www.bea.gov/industry/input-output-accounts-data" -o /tmp/io.html -w "code %{http_code} size %{size_download}\n" || true
          grep -oiE 'href="[^"]*\.(xlsx|xls|zip|csv)"' /tmp/io.html | sort -u | head -80 || true
          echo "== links on the io-annual directory"
          curl -sS -L -A "$UA" "https://apps.bea.gov/industry/xls/io-annual/" -o /tmp/dir.html -w "code %{http_code} size %{size_download}\n" || true
          grep -oiE 'href="[^"]*"' /tmp/dir.html | sort -u | head -120 || true
      - name: Fetch BEA summary use table (Supply-Use framework, producer values)
        run: |
          set -e
          UA="Mozilla/5.0 (X11; Linux x86_64) aiwsim-data-fetch"
          ok=0
          for u in ${BEA_URLS:-https://apps.bea.gov/industry/xls/io-annual/Use_SUT_Framework_2017-2024_SUM.xlsx https://apps.bea.gov/industry/xls/io-annual/Use_SUT_Framework_2017-2023_SUM.xlsx https://apps.bea.gov/industry/xls/io-annual/Use_Tables_Supply-Use_Framework_2017-2023_SUM.xlsx}; do
            f=$(basename "$u")
            code=$(curl -sS -L -A "$UA" -o "data/external/bea/$f" -w "%{http_code}" "$u" || true)
            sz=$(stat -c %s "data/external/bea/$f" 2>/dev/null || echo 0)
            echo "$f -> $code ($sz bytes)"
            if [ "$code" = "200" ] && [ "$sz" -gt 100000 ] && file "data/external/bea/$f" | grep -qi "zip\|excel\|Microsoft"; then ok=1; echo "$f" > data/external/bea/USE_TABLE_FILE; break; fi
            rm -f "data/external/bea/$f"
          done
          [ "$ok" = "1" ] || { echo "no BEA use table found (continuing so the discovery output is kept)"; }
          ls -la data/external/bea || true
        env:
          BEA_URLS: ${{ github.event.inputs.bea_urls }}
      - name: Fetch BLS OEWS national industry (sector level) and national cross-industry files
        run: |
          set -e
          mkdir -p data/external/bls /tmp/oews
          for v in 25 24; do
            code=$(curl -sS -L -A "Mozilla/5.0 aiwsim-data-fetch" -o /tmp/oews/in4.zip -w "%{http_code}" "https://www.bls.gov/oes/special-requests/oesm${v}in4.zip" || true)
            echo "oesm${v}in4.zip -> $code"
            if [ "$code" = "200" ] && [ "$(stat -c %s /tmp/oews/in4.zip)" -gt 1000000 ]; then
              curl -sS -L -A "Mozilla/5.0 aiwsim-data-fetch" -o /tmp/oews/nat.zip "https://www.bls.gov/oes/special-requests/oesm${v}nat.zip"
              echo "$v" > data/external/bls/OEWS_VINTAGE; break
            fi
            rm -f /tmp/oews/in4.zip
          done
          [ -f /tmp/oews/in4.zip ] || { echo "no OEWS industry file found"; exit 0; }
          unzip -l /tmp/oews/in4.zip | head -40
          unzip -l /tmp/oews/nat.zip | head -20
          python3 - <<'PY'
          import zipfile, re, shutil
          for z, pat in (("/tmp/oews/in4.zip", r"natsector_M20\d\d_dl\.xlsx$"), ("/tmp/oews/nat.zip", r"national_M20\d\d_dl\.xlsx$")):
              with zipfile.ZipFile(z) as zf:
                  names = [n for n in zf.namelist() if re.search(pat, n, re.I)]
                  assert names, (z, zf.namelist())
                  data = zf.read(names[0]); out = "data/external/bls/" + names[0].split("/")[-1]
                  open(out, "wb").write(data); print(out, len(data))
          PY
          ls -la data/external/bls
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/external
          git commit -m "External data: BEA summary use table and BLS OEWS sector and national files (fetched by the external-data workflow)" || echo "nothing to commit"
          git push
