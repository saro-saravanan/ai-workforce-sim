name: external-data
# Fetches the external source files that the build environment cannot reach (BEA input-output use table,
# BLS OEWS occupation-by-industry and national files) and commits them under data/external/ on the branch
# the workflow is run from. Run it from the Actions tab (workflow_dispatch); the ingest modules read from
# data/external/ when the files are present.
on:
  workflow_dispatch:
    inputs:
      bea_urls:
        description: space-separated BEA spreadsheet URLs to fetch (optional; defaults to the SUT-framework summary use table candidates)
        required: false
        default: ''
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Fetch BEA summary use table (Supply-Use framework, producer values)
        env:
          BEA_URLS: ${{ github.event.inputs.bea_urls }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
        run: |
          set -e
          mkdir -p data/external/bea
          UA="Mozilla/5.0 (X11; Linux x86_64) aiwsim-data-fetch"
          is_xlsx() { [ -s "$1" ] && [ "$(stat -c %s "$1")" -gt 100000 ] && file "$1" | grep -qiE "zip|excel|microsoft"; }
          echo "== Internet Archive index of the BEA io-annual directory (real file names)"
          curl -sS -A "$UA" "http://web.archive.org/cdx/search/cdx?url=apps.bea.gov/industry/xls/io-annual/*&output=txt&filter=statuscode:200&collapse=urlkey&limit=400" -o /tmp/cdx.txt || true
          awk '{print $2, $3}' /tmp/cdx.txt | sort -u | head -150 || true
          ok=0
          # 1. explicit URLs passed to the workflow
          for u in $BEA_URLS; do
            f=$(basename "$u"); curl -sS -L -A "$UA" -o "data/external/bea/$f" "$u" || true
            if is_xlsx "data/external/bea/$f"; then ok=1; echo "$f" > data/external/bea/USE_TABLE_FILE; echo "fetched $u"; break; fi; rm -f "data/external/bea/$f"
          done
          # 2. live BEA candidates (the site redirects unknown paths to its home page, hence the content check)
          if [ "$ok" = "0" ]; then
            for f in Use_SUT_Framework_2017-2024_SUM.xlsx Use_SUT_Framework_2017-2023_SUM.xlsx IOUse_Before_Redefinitions_PRO_1997-2024_Summary.xlsx IOUse_Before_Redefinitions_PRO_1997-2023_Summary.xlsx Use_Tables_Supply-Use_Framework_2017-2023_SUM.xlsx; do
              curl -sS -L -A "$UA" -o "data/external/bea/$f" "https://apps.bea.gov/industry/xls/io-annual/$f" || true
              if is_xlsx "data/external/bea/$f"; then ok=1; echo "$f" > data/external/bea/USE_TABLE_FILE; echo "fetched live $f"; break; fi; rm -f "data/external/bea/$f"
            done
          fi
          # 3. the names the archive index lists, live first then the archived copy (id_ returns the raw file)
          if [ "$ok" = "0" ] && [ -s /tmp/cdx.txt ]; then
            for line in $(awk '{print $2"|"$3}' /tmp/cdx.txt | grep -iE "use.*(sum|summary).*xlsx" | grep -viE "detail|_det|sector" | sort -u | tail -12); do
              u="${line%%|*}"; ts="${line##*|}"; f=$(basename "$u")
              curl -sS -L -A "$UA" -o "data/external/bea/$f" "$u" || true
              if is_xlsx "data/external/bea/$f"; then ok=1; echo "$f" > data/external/bea/USE_TABLE_FILE; echo "fetched live (indexed name) $u"; break; fi
              curl -sS -L -A "$UA" -o "data/external/bea/$f" "http://web.archive.org/web/${ts}id_/$u" || true
              if is_xlsx "data/external/bea/$f"; then ok=1; echo "$f" > data/external/bea/USE_TABLE_FILE; echo "archived copy $ts of $u" > data/external/bea/USE_TABLE_SOURCE; echo "fetched archived $u @ $ts"; break; fi
              rm -f "data/external/bea/$f"
            done
          fi
          # 4. the BEA API, when a key is configured (repository secret BEA_API_KEY): pick the summary use table at producer prices by its
          #    description, then fetch the latest year the dataset offers
          if [ "$ok" = "0" ] && [ -n "$BEA_API_KEY" ]; then
            curl -sS -A "$UA" "https://apps.bea.gov/api/data/?UserID=$BEA_API_KEY&method=GetParameterValues&DataSetName=InputOutput&ParameterName=TableID&ResultFormat=json" -o /tmp/bea_tables.json || true
            python3 - <<'PY'
          import json, re, sys
          try:
              d = json.load(open("/tmp/bea_tables.json"))
          except Exception as e:
              print("table list unreadable:", e); sys.exit(0)
          vals = d.get("BEAAPI", {}).get("Results", {}).get("ParamValue", [])
          print(f"{len(vals)} InputOutput tables")
          pick = None
          for v in vals:
              desc = str(v.get("Desc", "")); key = str(v.get("Key", ""))
              if re.search(r"\buse\b", desc, re.I) and re.search(r"summary", desc, re.I) and re.search(r"producer", desc, re.I) and not re.search(r"after redefinitions", desc, re.I):
                  print("candidate", key, desc)
                  if pick is None or "before redefinitions" in desc.lower():
                      pick = key
          for v in vals[:80]:
              print("  ", v.get("Key"), str(v.get("Desc", ""))[:110])
          open("/tmp/bea_table_id", "w").write(pick or "")
          print("picked", pick)
          PY
            TID=$(cat /tmp/bea_table_id)
            if [ -n "$TID" ]; then
              for Y in 2024 2023 2022; do
                curl -sS -A "$UA" "https://apps.bea.gov/api/data/?UserID=$BEA_API_KEY&method=GetData&DataSetName=InputOutput&TableID=$TID&Year=$Y&ResultFormat=json" -o "data/external/bea/use_summary_${Y}_api.json" || true
                sz=$(stat -c %s "data/external/bea/use_summary_${Y}_api.json" 2>/dev/null || echo 0); echo "TableID $TID year $Y -> $sz bytes"
                if [ "$sz" -gt 100000 ] && grep -q '"DataValue"' "data/external/bea/use_summary_${Y}_api.json"; then ok=1; echo "use_summary_${Y}_api.json" > data/external/bea/USE_TABLE_FILE; echo "BEA API TableID $TID year $Y" > data/external/bea/USE_TABLE_SOURCE; echo "fetched via API"; break; fi
                rm -f "data/external/bea/use_summary_${Y}_api.json"
              done
            fi
          fi
          [ "$ok" = "1" ] || echo "no BEA use table found"
          ls -la data/external/bea || true
      - name: Fetch BLS OEWS national industry (sector level) and national cross-industry files
        run: |
          set -e
          mkdir -p data/external/bls /tmp/oews
          for v in 25 24; do
            code=$(curl -sS -L -A "Mozilla/5.0 aiwsim-data-fetch" -o /tmp/oews/in4.zip -w "%{http_code}" "https://www.bls.gov/oes/special-requests/oesm${v}in4.zip" || true)
            echo "oesm${v}in4.zip -> $code"
            if [ "$code" = "200" ] && [ "$(stat -c %s /tmp/oews/in4.zip)" -gt 1000000 ]; then
              curl -sS -L -A "Mozilla/5.0 aiwsim-data-fetch" -o /tmp/oews/nat.zip "https://www.bls.gov/oes/special-requests/oesm${v}nat.zip"
              echo "$v" > data/external/bls/OEWS_VINTAGE; break
            fi
            rm -f /tmp/oews/in4.zip
          done
          [ -f /tmp/oews/in4.zip ] || { echo "no OEWS industry file found"; exit 0; }
          unzip -l /tmp/oews/in4.zip | head -40
          unzip -l /tmp/oews/nat.zip | head -20
          v=$(cat data/external/bls/OEWS_VINTAGE)
          curl -sS -L -A "Mozilla/5.0 aiwsim-data-fetch" -o /tmp/oews/st.zip "https://www.bls.gov/oes/special-requests/oesm${v}st.zip" || true
          unzip -l /tmp/oews/st.zip | head -10 || true
          python3 - <<'PY'
          import zipfile, re, shutil
          for z, pat in (("/tmp/oews/in4.zip", r"natsector_M20\d\d_dl\.xlsx$"), ("/tmp/oews/nat.zip", r"national_M20\d\d_dl\.xlsx$"), ("/tmp/oews/st.zip", r"state_M20\d\d_dl\.xlsx$")):
              with zipfile.ZipFile(z) as zf:
                  names = [n for n in zf.namelist() if re.search(pat, n, re.I)]
                  assert names, (z, zf.namelist())
                  data = zf.read(names[0]); out = "data/external/bls/" + names[0].split("/")[-1]
                  open(out, "wb").write(data); print(out, len(data))
          PY
          ls -la data/external/bls
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/external
          git commit -m "External data: BEA summary use table and BLS OEWS sector and national files (fetched by the external-data workflow)" || echo "nothing to commit"
          git push
