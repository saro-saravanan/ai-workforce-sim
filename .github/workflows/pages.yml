name: pages
# Public static demo: run the scenarios once, export the documents the web app reads in static mode
# (docs/contracts.md §18), build the Vue app under /ai-workforce-sim/, deploy to GitHub Pages.
# Enable Pages with source "GitHub Actions" in the repository settings once; then every push to the
# default branch (or a manual run) redeploys.
on:
  push:
    branches: [main, spec/model-v0.1]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-packages
      - run: uv run aiwsim data fetch     # pinned, checksummed raw inputs (data/raw is not committed)
      - run: uv run aiwsim data build
      - run: uv run python -m aiwsim_api.export_static --out web/public/static --draws 200
      - uses: actions/upload-artifact@v4
        with: { name: static, path: web/public/static, retention-days: 3 }
  build:
    needs: export
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: static, path: web/public/static }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env: { VITE_STATIC: "1", VITE_BASE: "/ai-workforce-sim/" }
      - run: cp dist/index.html dist/404.html   # SPA fallback for deep links
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
